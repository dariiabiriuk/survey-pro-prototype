<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Survey Pro — прототип</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #fff;
      --tx: #1d2433;
      --mu: #667085;
      --pr: #3b5bdb;
      --bd: #dfe3ec;
      --ok: #2f9e44;
      --wr: #e8590c;
      --er: #c92a2a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c;
        --card: #1b2030;
        --tx: #e8ebf3;
        --mu: #9aa3b8;
        --pr: #7c96ff;
        --bd: #2c3347;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.45 system-ui, Arial, sans-serif;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--bd);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header b { color: var(--pr); font-size: 18px; }
    header span { margin-left: auto; color: var(--mu); }

    main { max-width: 860px; margin: 0 auto; padding: 20px; }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 14px;
    }
    h2 { margin: 0 0 12px; font-size: 20px; }
    h3 { margin: 0 0 8px; font-size: 16px; }

    button {
      font: inherit;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      padding: 7px 13px;
      border-radius: 7px;
      cursor: pointer;
    }
    button.p { background: var(--pr); border-color: var(--pr); color: #fff; }
    button.d { color: var(--er); }

    input, select {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--bd);
      border-radius: 7px;
      background: var(--bg);
      color: var(--tx);
      width: 100%;
    }
    label { display: block; margin: 10px 0 4px; color: var(--mu); font-size: 13px; }

    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .sp { flex: 1; }
    .tag { padding: 2px 9px; border-radius: 99px; font-size: 12px; color: #fff; }

    .Чернетка { background: #868e96; }
    .Активне { background: var(--ok); }
    .Призупинено { background: var(--wr); }
    .Завершено { background: var(--pr); }

    .bar {
      height: 20px;
      background: var(--pr);
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      padding-left: 6px;
      min-width: 22px;
    }
    .err { color: var(--er); margin-top: 8px; }
    .mu { color: var(--mu); }
    .opt { display: block; margin: 6px 0; color: var(--tx); font-size: 15px; }
    .opt input { width: auto; margin-right: 8px; }
    .kpi { display: flex; gap: 12px; }
    .kpi div { flex: 1; text-align: center; }
