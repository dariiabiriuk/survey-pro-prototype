<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Survey Pro — прототип</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mu:#667085;--pr:#3b5bdb;--bd:#dfe3ec;--ok:#2f9e44;--wr:#e8590c;--er:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#9aa3b8;--pr:#7c96ff;--bd:#2c3347}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;align-items:center;gap:16px}
header b{color:var(--pr);font-size:18px}header span{margin-left:auto;color:var(--mu)}
main{max-width:860px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:7px;cursor:pointer}
button.p{background:var(--pr);border-color:var(--pr);color:#fff}button.d{color:var(--er)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);width:100%}
label{display:block;margin:10px 0 4px;color:var(--mu);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;color:#fff}
.Чернетка{background:#868e96}.Активне{background:var(--ok)}.Призупинено{background:var(--wr)}.Завершено{background:var(--pr)}
.bar{height:20px;background:var(--pr);border-radius:4px;color:#fff;font-size:12px;padding-left:6px;min-width:22px}
.err{color:var(--er);margin-top:8px}.mu{color:var(--mu)}
.opt{display:block;margin:6px 0;color:var(--tx);font-size:15px}.opt input{width:auto;margin-right:8px}
.kpi{display:flex;gap:12px}.kpi div{flex:1;text-align:center}.kpi b{display:block;font-size:26px;color:var(--pr)}
</style></head><body>
<header><b>Survey Pro</b><nav class="row" id="nav"></nav><span id="who"></span></header>
<main id="app"></main>
<script>
// Mock data
let user=null,cur=null,nextId=4,ans=null;
const S=[
{id:1,title:"Задоволеність студентів дистанційним навчанням",st:"Активне",q:[
 {t:"Як ви оцінюєте якість лекцій?",k:"choice",o:["Відмінно","Добре","Задовільно","Погано"]},
 {t:"Чого найбільше бракує?",k:"text",o:[]}],r:[[0,"Дуже зручна платформа"],[1,""],[0,"Більше практики"],[2,"Збої зв'язку"],[1,""]],
 res:{0:[12,18,7,2]}},
{id:2,title:"Споживчі звички: онлайн-покупки",st:"Чернетка",q:[],r:[],res:{}},
{id:3,title:"Оцінка роботи бібліотеки",st:"Завершено",q:[{t:"Як часто ви користуєтесь бібліотекою?",k:"choice",o:["Щодня","Щотижня","Рідко"]}],r:[],res:{0:[5,21,14]}}];
const $=s=>document.querySelector(s);
const count=s=>s.r.length+(s.res[0]?s.res[0].reduce((a,b)=>a+b,0):0);
function nav(){ $('#who').textContent=user?("👤 "+user):"";
 $('#nav').innerHTML=user?'<button onclick="list()">Мої опитування</button>':''; }
function login(msg){ nav(); $('#app').innerHTML=`<div class="card" style="max-width:380px;margin:40px auto"><h2>Вхід для дослідника</h2>
<label>Email</label><input id="em" value="researcher@survey.pro"><label>Пароль</label><input id="pw" type="password" value="123456">
<div class="err">${msg||''}</div><div class="row" style="margin-top:12px"><button class="p sp" onclick="doLogin()">Увійти</button></div>
<p class="mu">Респондент? <a href="#" onclick="respond(1);return false">Пройти демо-опитування</a></p></div>`;}
function doLogin(){const e=$('#em').value,p=$('#pw').value;
 if(!/^\S+@\S+\.\S+$/.test(e))return login("Невірний формат email");
 if(p.length<6)return login("Пароль має містити щонайменше 6 символів");
 user=e;list();}
function list(){nav();
 $('#app').innerHTML=`<div class="row"><h2 class="sp">Мої опитування</h2><button class="p" onclick="edit()">+ Створити опитування</button></div>`+
 S.map(s=>`<div class="card row"><div class="sp"><h3>${s.title}</h3><span class="mu">Запитань: ${s.q.length} · Відповідей: ${count(s)}</span></div>
 <span class="tag ${s.st}">${s.st}</span>
 <button onclick="edit(${s.id})">Редагувати</button>
 ${s.st=="Чернетка"?`<button class="p" onclick="publish(${s.id})">Опублікувати</button>`:''}
 ${s.st=="Активне"?`<button onclick="setSt(${s.id},'Призупинено')">Пауза</button><button onclick="respond(${s.id})">Пройти</button>`:''}
 ${s.st=="Призупинено"?`<button onclick="setSt(${s.id},'Активне')">Відновити</button>`:''}
 <button onclick="results(${s.id})">Результати</button><button class="d" onclick="del(${s.id})">Видалити</button></div>`).join('')||'<p class="mu">Опитувань ще немає</p>';}
function setSt(id,st){S.find(s=>s.id==id).st=st;list();}
function del(id){if(confirm("Видалити опитування?")){S.splice(S.findIndex(s=>s.id==id),1);list();}}
function publish(id){const s=S.find(x=>x.id==id);
 if(!s.q.length){alert("Анкета неповна: додайте щонайменше одне запитання");return edit(id);}
 s.st="Активне";list();}
function edit(id){cur=id?S.find(s=>s.id==id):{id:nextId++,title:"",st:"Чернетка",q:[],r:[],res:{},isNew:true};
 draw();}
function draw(msg){ $('#app').innerHTML=`<div class="card"><h2>${cur.isNew?'Нове опитування':'Редагування опитування'}</h2>
 <label>Назва</label><input id="tt" value="${cur.title}" oninput="cur.title=this.value">
 <div class="err">${msg||''}</div></div>
 ${cur.q.map((q,i)=>`<div class="card"><div class="row"><b class="sp">Запитання ${i+1}</b><button class="d" onclick="cur.q.splice(${i},1);draw()">✕</button></div>
 <label>Текст</label><input value="${q.t}" oninput="cur.q[${i}].t=this.value">
 <label>Тип</label><select onchange="cur.q[${i}].k=this.value;draw()"><option value="choice" ${q.k=='choice'?'selected':''}>Один варіант</option><option value="text" ${q.k=='text'?'selected':''}>Відкрита відповідь</option></select>
 ${q.k=='choice'?`<label>Варіанти (через кому)</label><input value="${q.o.join(', ')}" oninput="cur.q[${i}].o=this.value.split(',').map(x=>x.trim()).filter(Boolean)">`:''}</div>`).join('')}
 <div class="row"><button onclick="cur.q.push({t:'',k:'choice',o:['Так','Ні']});draw()">+ Додати запитання</button><span class="sp"></span>
 <button onclick="list()">Скасувати</button><button class="p" onclick="save()">Зберегти</button></div>`;}
function save(){ if(!cur.title.trim())return draw("Вкажіть назву опитування");
 if(cur.q.some(q=>!q.t.trim()||(q.k=='choice'&&q.o.length<2)))return draw("Кожне запитання потребує тексту, а вибір — щонайменше двох варіантів");
 delete cur.isNew; if(!S.includes(cur))S.push(cur); list();}
function results(id){const s=S.find(x=>x.id==id);cur=s;nav();
 const tot=count(s);
 $('#app').innerHTML=`<div class="row"><h2 class="sp">${s.title}</h2><button onclick="list()">← Назад</button></div>
 <div class="card kpi"><div><b>${tot}</b>відповідей</div><div><b>${s.q.length}</b>запитань</div><div><b>${s.st}</b>статус</div></div>
 ${s.q.map((q,i)=>{if(q.k=='choice'){const d=s.res[i]||q.o.map(_=>0);const m=Math.max(...d,1);
  return `<div class="card"><h3>${q.t}</h3>${q.o.map((o,j)=>`<div class="row" style="margin:6px 0"><span style="width:130px">${o}</span><div class="bar" style="width:${(d[j]||0)/m*60}%">${d[j]||0}</div></div>`).join('')}</div>`}
  const tx=s.r.map(r=>r[1]).filter(Boolean);return `<div class="card"><h3>${q.t}</h3>${tx.map(t=>`<div class="mu">• ${t}</div>`).join('')||'<span class="mu">Відповідей немає</span>'}</div>`}).join('')}
 <button class="p" onclick="exportCsv()">Експорт у CSV</button>`;}
function exportCsv(){alert("Прототип: файл «"+cur.title+".csv» сформовано ("+count(cur)+" рядків)");}
function respond(id){const s=S.find(x=>x.id==id);nav();
 if(s.st!="Активне"){$('#app').innerHTML=`<div class="card"><h2>Опитування недоступне</h2><p>Термін проведення минув або збір відповідей зупинено.</p><button onclick="user?list():login()">Закрити</button></div>`;return;}
 $('#app').innerHTML=`<div class="card" style="max-width:520px;margin:30px auto"><h2>${s.title}</h2>
 <p>Ваші відповіді буде оброблено анонімно відповідно до політики конфіденційності.</p>
 <label class="opt"><input type="checkbox" id="ag">Погоджуюсь на обробку даних</label><div class="err" id="ae"></div>
 <div class="row"><button class="sp" onclick="user?list():login()">Відмовитись</button><button class="p sp" onclick="if(!$('#ag').checked)$('#ae').textContent='Без згоди продовжити неможливо';else{ans=[];ask(${id},0)}">Почати</button></div></div>`;}
function ask(id,i,msg){const s=S.find(x=>x.id==id),q=s.q[i];
 $('#app').innerHTML=`<div class="card" style="max-width:520px;margin:30px auto"><div class="mu">Запитання ${i+1} з ${s.q.length}</div>
 <div class="bar" style="width:${(i+1)/s.q.length*100}%;height:6px;margin:6px 0 14px"></div><h3>${q.t}</h3>
 ${q.k=='choice'?q.o.map((o,j)=>`<label class="opt"><input type="radio" name="a" value="${j}">${o}</label>`).join(''):'<input id="tx" placeholder="Ваша відповідь">'}
 <div class="err">${msg||''}</div><div class="row" style="margin-top:12px"><button class="p sp" onclick="nxt(${id},${i})">${i==s.q.length-1?'Завершити':'Далі'}</button></div></div>`;}
function nxt(id,i){const s=S.find(x=>x.id==id),q=s.q[i];let v;
 if(q.k=='choice'){const r=document.querySelector('input[name=a]:checked');if(!r)return ask(id,i,"Оберіть варіант відповіді");v=+r.value}
 else v=$('#tx').value;ans[i]=v;
 if(i<s.q.length-1)return ask(id,i+1);
 ans.forEach((a,k)=>{if(s.q[k].k=='choice'){s.res[k]=s.res[k]||s.q[k].o.map(_=>0);s.res[k][a]++}});
 $('#app').innerHTML=`<div class="card" style="max-width:520px;margin:30px auto;text-align:center"><h2>Дякуємо!</h2><p>Вашу відповідь збережено.</p><button class="p" onclick="user?list():login()">Готово</button></div>`;}
login();
</script></body></html>
